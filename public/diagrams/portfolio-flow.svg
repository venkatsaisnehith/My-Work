<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc"><title id="title">Portfolio publishing process</title><desc id="desc">Content and assets in GitHub flow into a Node.js build, then static pages, automated checks, and a hosting provider chosen later.</desc><rect width="720" height="280" fill="#eef0e9"/><g fill="#f7f6f1" stroke="#3f6553"><rect x="24" y="60" width="148" height="100" rx="4"/><rect x="198" y="60" width="148" height="100" rx="4"/><rect x="372" y="60" width="148" height="100" rx="4"/><rect x="546" y="60" width="148" height="100" rx="4"/></g><g fill="#242c28" font-family="sans-serif" font-size="16" text-anchor="middle"><text x="98" y="100">Content + assets</text><text x="98" y="128" font-size="12">Versioned in GitHub</text><text x="272" y="100">Node.js build</text><text x="272" y="128" font-size="12">HTML, CSS, JS, RSS</text><text x="446" y="100">Automated checks</text><text x="446" y="128" font-size="12">Links and behavior</text><text x="620" y="100">Hosting</text><text x="620" y="128" font-size="12">Provider to be chosen</text><text x="360" y="222" font-size="13">One repository → portable static website</text></g><g stroke="#3f6553" fill="none" stroke-width="2"><path d="M176 110h17m-6-5 6 5-6 5M350 110h17m-6-5 6 5-6 5M524 110h17m-6-5 6 5-6 5"/></g></svg>
