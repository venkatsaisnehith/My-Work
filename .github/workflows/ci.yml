name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and verify portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and run automated checks
        run: npm run check
      - name: Save verified website for review
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-static-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
